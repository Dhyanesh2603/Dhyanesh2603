<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="NOUS — Software Architecture Intelligence Platform">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .flow{stroke-dasharray:4 6;animation:f 2.4s linear infinite}
    @keyframes f{to{stroke-dashoffset:-20}}
    .n{animation:g 3s ease-in-out infinite}
    .n2{animation-delay:1s}.n3{animation-delay:2s}
    @keyframes g{50%{fill:#fafafa}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d0f"/><stop offset="1" stop-color="#08080a"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy=".4" r=".45"><stop offset="0" stop-color="#3b82f6" stop-opacity=".09"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".05"/></pattern>
  </defs>
  <rect x=".5" y=".5" width="1199" height="559" rx="16" fill="url(#bg)" stroke="#1f1f22"/>
  <rect x="1" y="1" width="1198" height="558" rx="16" fill="url(#glow)"/>

  <!-- left: copy -->
  <text x="48" y="64" class="mono" font-size="12" fill="#71717a" letter-spacing="2">01 — FLAGSHIP</text>
  <text x="48" y="122" class="sans" font-size="52" font-weight="600" fill="#fafafa" letter-spacing="-2">NOUS</text>
  <text x="48" y="156" class="sans" font-size="20" fill="#a1a1aa">Software Architecture Intelligence Platform</text>

  <text x="48" y="208" class="mono" font-size="11" fill="#52525b" letter-spacing="2">PROBLEM</text>
  <g class="sans" font-size="16" fill="#d4d4d8">
    <text x="48" y="234">Large codebases outgrow the mental model of the</text>
    <text x="48" y="256">people who maintain them. NOUS rebuilds that model —</text>
    <text x="48" y="278">structure, dependencies and intent — automatically.</text>
  </g>

  <text x="48" y="326" class="mono" font-size="11" fill="#52525b" letter-spacing="2">ENGINEERING</text>
  <g class="sans" font-size="15" fill="#a1a1aa">
    <text x="48" y="354"><tspan fill="#fafafa">Parsing</tspan>   — multi-language AST extraction &amp; symbol tables</text>
    <text x="48" y="380"><tspan fill="#fafafa">Graphs</tspan>    — dependency graphs, cycles, centrality, layering</text>
    <text x="48" y="406"><tspan fill="#fafafa">Retrieval</tspan> — semantic code search over embedded symbols</text>
    <text x="48" y="432"><tspan fill="#fafafa">AI</tspan>        — LLM reasoning grounded in graph context</text>
  </g>

  <g class="mono" font-size="12" fill="#a1a1aa">
    <rect x="48" y="478" width="74" height="28" rx="14" fill="none" stroke="#27272a"/><text x="85" y="496" text-anchor="middle">Python</text>
    <rect x="130" y="478" width="82" height="28" rx="14" fill="none" stroke="#27272a"/><text x="171" y="496" text-anchor="middle">FastAPI</text>
    <rect x="220" y="478" width="100" height="28" rx="14" fill="none" stroke="#27272a"/><text x="270" y="496" text-anchor="middle">TypeScript</text>
    <rect x="328" y="478" width="70" height="28" rx="14" fill="none" stroke="#27272a"/><text x="363" y="496" text-anchor="middle">React</text>
    <rect x="406" y="478" width="104" height="28" rx="14" fill="none" stroke="#27272a"/><text x="458" y="496" text-anchor="middle">PostgreSQL</text>
    <rect x="518" y="478" width="56" height="28" rx="14" fill="none" stroke="#27272a"/><text x="546" y="496" text-anchor="middle">LLM</text>
  </g>

  <!-- right: graph visual -->
  <g transform="translate(660 60)">
    <rect width="492" height="440" rx="12" fill="#09090b" stroke="#1f1f22"/>
    <rect width="492" height="440" rx="12" fill="url(#dots)"/>
    <text x="20" y="30" class="mono" font-size="11" fill="#52525b">nous graph ./src --depth 3</text>
    <line x1="0" y1="46" x2="492" y2="46" stroke="#18181b"/>

    <g stroke="#3f3f46" stroke-width="1.2" fill="none">
      <path class="flow" d="M246 110 L130 200"/><path class="flow" d="M246 110 L362 200"/>
      <path class="flow" d="M130 200 L80 300"/><path class="flow" d="M130 200 L200 300"/>
      <path class="flow" d="M362 200 L300 300"/><path class="flow" d="M362 200 L420 300"/>
      <path class="flow" d="M200 300 L250 380"/><path class="flow" d="M300 300 L250 380"/>
      <path d="M80 300 Q60 360 250 380" stroke="#27272a"/>
    </g>
    <g class="mono" font-size="11" text-anchor="middle">
      <rect x="196" y="94" width="100" height="32" rx="8" fill="#18181b" stroke="#3b82f6" stroke-opacity=".6"/><text x="246" y="114" fill="#fafafa">app.core</text>
      <rect x="84" y="184" width="92" height="32" rx="8" fill="#111113" stroke="#27272a"/><text x="130" y="204" fill="#a1a1aa" class="n">parser</text>
      <rect x="316" y="184" width="92" height="32" rx="8" fill="#111113" stroke="#27272a"/><text x="362" y="204" fill="#a1a1aa" class="n n2">graph</text>
      <rect x="44" y="284" width="72" height="32" rx="8" fill="#111113" stroke="#27272a"/><text x="80" y="304" fill="#71717a">ast</text>
      <rect x="160" y="284" width="80" height="32" rx="8" fill="#111113" stroke="#27272a"/><text x="200" y="304" fill="#71717a">symbols</text>
      <rect x="260" y="284" width="80" height="32" rx="8" fill="#111113" stroke="#27272a"/><text x="300" y="304" fill="#71717a">deps</text>
      <rect x="380" y="284" width="80" height="32" rx="8" fill="#111113" stroke="#27272a"/><text x="420" y="304" fill="#71717a">layers</text>
      <rect x="200" y="364" width="100" height="32" rx="8" fill="#111113" stroke="#27272a"/><text x="250" y="384" fill="#a1a1aa" class="n n3">semantic</text>
    </g>
    <text x="20" y="424" class="mono" font-size="11" fill="#52525b">8 modules · 9 edges · 0 cycles</text>
  </g>
</svg>
