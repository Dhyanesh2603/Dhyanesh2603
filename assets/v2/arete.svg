<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-label="Arete — Engineering Productivity Workspace">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .sweep{animation:s 5s ease-in-out infinite}
    @keyframes s{0%{transform:translateX(-200px)}60%,100%{transform:translateX(620px)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d0f"/><stop offset="1" stop-color="#08080a"/></linearGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x=".5" y=".5" width="599" height="349" rx="14" fill="url(#bg)" stroke="#1f1f22"/>
  <rect x="0" y="0" width="160" height="1" fill="url(#hl)" class="sweep"/>
  <text x="32" y="44" class="mono" font-size="11" fill="#52525b" letter-spacing="2">04 &#8212; PRODUCT</text>
  <text x="32" y="94" class="sans" font-size="32" font-weight="600" fill="#fafafa" letter-spacing="-1">Arete</text>
  <text x="32" y="122" class="sans" font-size="16" fill="#a1a1aa">Engineering Productivity Workspace</text>
  <text x="32" y="164" class="sans" font-size="14" fill="#d4d4d8">Unified workspace for notes, tasks, study and deep work.</text>
  <line x1="32" y1="190" x2="568" y2="190" stroke="#18181b"/>
  <g class="sans" font-size="14" fill="#a1a1aa">
    <rect x="32" y="217" width="6" height="1.5" fill="#52525b"/><text x="48" y="222">Modular block-based document editor</text>
    <rect x="32" y="241" width="6" height="1.5" fill="#52525b"/><text x="48" y="246">Spaced repetition for DSA mastery</text>
    <rect x="32" y="265" width="6" height="1.5" fill="#52525b"/><text x="48" y="270">Roadmaps, focus sessions and daily planning</text>
  </g>
  <g class="mono" font-size="12" fill="#a1a1aa">
    <rect x="32" y="300" width="50" height="26" rx="13" fill="none" stroke="#27272a"/><text x="57" y="317" text-anchor="middle">Dart</text>
    <rect x="90" y="300" width="92" height="26" rx="13" fill="none" stroke="#27272a"/><text x="136" y="317" text-anchor="middle">Flutter Web</text>
    <rect x="190" y="300" width="85" height="26" rx="13" fill="none" stroke="#27272a"/><text x="232" y="317" text-anchor="middle">Riverpod</text>
    <rect x="283" y="300" width="88" height="26" rx="13" fill="none" stroke="#27272a"/><text x="327" y="317" text-anchor="middle">Supabase</text>
  </g>
</svg>