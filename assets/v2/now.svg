<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Current focus areas">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .pulse{animation:p 2s ease-out infinite;transform-origin:44px 40px}
    @keyframes p{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  </style>
  <rect x=".5" y=".5" width="1199" height="219" rx="12" fill="#0a0a0b" stroke="#1f1f22"/>
  <circle cx="44" cy="40" r="4" fill="#22c55e" class="pulse"/>
  <circle cx="44" cy="40" r="4" fill="#22c55e"/>
  <text x="60" y="45" class="mono" font-size="13" fill="#a1a1aa" letter-spacing="1.5">CURRENTLY</text>
  <text x="1164" y="45" text-anchor="end" class="mono" font-size="13" fill="#52525b">active</text>
  <line x1="0" y1="68" x2="1200" y2="68" stroke="#18181b"/>

  <g class="mono" font-size="12" fill="#52525b" letter-spacing="1.5">
    <text x="36" y="108">BUILDING</text>
    <text x="36" y="154">RESEARCH</text>
    <text x="36" y="200">DEPTH</text>
  </g>
  <g class="sans" font-size="18" fill="#fafafa" letter-spacing="-.2">
    <text x="190" y="108">Architecture-aware developer tools and code intelligence</text>
    <text x="190" y="154">LLM reasoning grounded in static analysis and retrieval</text>
    <text x="190" y="200">Distributed systems, consensus protocols, storage engines</text>
  </g>
  <g class="mono" font-size="13" fill="#52525b" text-anchor="end">
    <text x="1164" y="108">AST &#183; graphs &#183; semantic search</text>
    <text x="1164" y="154">RAG &#183; embeddings &#183; inference</text>
    <text x="1164" y="200">replication &#183; fault tolerance</text>
  </g>
  <line x1="36" y1="125" x2="1164" y2="125" stroke="#141416"/>
  <line x1="36" y1="171" x2="1164" y2="171" stroke="#141416"/>
</svg>
