<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Dhyanesh S — Software Engineer in Progress">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .r{opacity:0;animation:in .5s ease forwards}
    .d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.3s}.d4{animation-delay:1.7s}.d5{animation-delay:2.1s}.d6{animation-delay:2.5s}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .type{clip-path:inset(0 100% 0 0);animation:type .6s steps(6) .3s forwards}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c0d"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <radialGradient id="glow" cx=".82" cy=".1" r=".6"><stop offset="0" stop-color="#3b82f6" stop-opacity=".10"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  </defs>

  <rect x=".5" y=".5" width="1199" height="439" rx="14" fill="url(#bg)" stroke="#1f1f22"/>
  <rect x="1" y="1" width="1198" height="438" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="438" rx="14" fill="url(#glow)"/>
  <rect x="200" y="0" width="800" height="1" fill="url(#edge)"/>

  <!-- window chrome -->
  <g transform="translate(28 26)">
    <circle r="5" fill="#2a2a2e"/><circle cx="18" r="5" fill="#2a2a2e"/><circle cx="36" r="5" fill="#2a2a2e"/>
  </g>
  <text x="600" y="31" text-anchor="middle" class="mono" font-size="12" fill="#5a5a60">~/dhyanesh — zsh</text>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#18181b"/>

  <!-- terminal -->
  <g class="mono" font-size="17">
    <text x="56" y="108"><tspan fill="#6b6b72">$ </tspan><tspan fill="#ededed">whoami</tspan></text>
  </g>
  <text x="56" y="178" class="sans r d1" font-size="54" font-weight="600" letter-spacing="-1.6" fill="#fafafa">Dhyanesh S</text>
  <text x="58" y="214" class="sans r d2" font-size="20" fill="#a1a1aa" letter-spacing="-.2">Software Engineer in Progress · CSE @ VIT Vellore</text>

  <g class="sans r d3" font-size="17" fill="#d4d4d8">
    <text x="58" y="270">Building intelligent systems, developer tools,</text>
    <text x="58" y="296">and software designed to scale.</text>
  </g>

  <g class="mono r d4" font-size="15">
    <text x="58" y="350"><tspan fill="#6b6b72">$ </tspan><tspan fill="#a1a1aa">echo $FOCUS</tspan></text>
    <text x="58" y="378"><tspan fill="#ededed">AI</tspan><tspan fill="#52525b"> × </tspan><tspan fill="#ededed">Systems</tspan><tspan fill="#52525b"> × </tspan><tspan fill="#ededed">Product Engineering</tspan></text>
  </g>
  <rect x="58" y="392" width="9" height="17" fill="#ededed" class="cur r d5"/>
</svg>
